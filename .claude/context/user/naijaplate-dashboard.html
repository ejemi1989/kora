<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NaijaPlate — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#ea2804;
  --primary-deep:#c01f00;
  --primary-bg:rgba(234,40,4,0.08);
  --on-primary:#fff;
  --ink:#171717;
  --body:#4d4d4d;
  --muted:#888;
  --ash:#a1a1a1;
  --stone:#bbb;
  --canvas:#fafafa;
  --surface-card:#fff;
  --surface-soft:#f5f5f5;
  --surface-dark:#171717;
  --hairline:#ebebeb;
  --success:#0070f3;
  --success-bg:#e8f3ff;
  --warning:#f5a623;
  --warning-bg:#ffefcf;
  --danger:#ee0000;
  --danger-bg:#f7d4d6;
  --info:#7928ca;
  --info-bg:#f0edf8;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sidebar-w:240px;
  --header-h:52px;
  --radius-xs:4px;
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:12px;
  --radius-xl:16px;
  --radius-full:9999px;
  --shadow-card:0 0 0 1px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-elevated:0 0 0 1px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-modal:0 0 0 1px rgba(0,0,0,0.04), 0 8px 16px rgba(0,0,0,0.06), 0 24px 48px rgba(0,0,0,0.08);
  --transition:150ms cubic-bezier(0.4,0,0.2,1);
}
html{height:100%}
body{height:100%;font-family:var(--font-sans);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--stone);border-radius:4px}
::selection{background:var(--ink);color:#f2f2f2}

.app{display:flex;height:100vh;overflow:hidden}

/* ─── SIDEBAR ─── */
.sidebar{width:var(--sidebar-w);background:var(--surface-card);border-right:1px solid var(--hairline);display:flex;flex-direction:column;flex-shrink:0;z-index:50;overflow:hidden}
.sidebar-brand{height:var(--header-h);padding:0 16px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sidebar-mark{width:28px;height:28px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-weight:700;font-size:13px;flex-shrink:0}
.sidebar-name{font-size:15px;font-weight:600;letter-spacing:-0.03em;color:var(--ink)}
.sidebar-name small{font-weight:400;color:var(--muted);font-size:13px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:1px}
.sidebar-group{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--ash);padding:12px 12px 4px;font-family:var(--font-mono)}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:450;color:var(--body);transition:var(--transition);cursor:pointer;position:relative}
.sidebar-link:hover{background:var(--canvas);color:var(--ink)}
.sidebar-link.active{background:var(--primary-bg);color:var(--primary);font-weight:500}
.sidebar-link.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--primary);border-radius:0 2px 2px 0}
.sidebar-link svg{width:16px;height:16px;flex-shrink:0;opacity:0.6}
.sidebar-link.active svg{opacity:1}
.sidebar-link-badge{font-size:10px;font-weight:500;margin-left:auto;background:var(--surface-soft);color:var(--body);padding:1px 7px;border-radius:var(--radius-full);line-height:1.4}
.sidebar-link.active .sidebar-link-badge{background:var(--primary-bg);color:var(--primary)}
.sidebar-foot{flex-shrink:0;padding:8px;border-top:1px solid var(--hairline)}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition)}
.sidebar-user:hover{background:var(--canvas)}
.sidebar-user-av{width:30px;height:30px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:-0.02em}
.sidebar-user-name{font-size:12px;font-weight:500;color:var(--ink);line-height:1.3}
.sidebar-user-role{font-size:10px;color:var(--muted);line-height:1.2;font-weight:450}

/* ─── TOPBAR ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--header-h);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;background:var(--surface-card);border-bottom:1px solid var(--hairline)}
.topbar-mobile{display:none;padding:6px;margin:-6px;color:var(--body)}
.topbar-search{position:relative;max-width:240px;width:100%}
.topbar-search input{width:100%;height:32px;border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:0 12px 0 32px;font-size:12px;background:var(--canvas);outline:none;transition:var(--transition);caret-color:var(--primary)}
.topbar-search input:focus{border-color:var(--primary);background:var(--surface-card);box-shadow:0 0 0 3px var(--primary-bg)}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ash);pointer-events:none}
.topbar-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.topbar-btn{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:var(--transition);position:relative;border:none;background:none}
.topbar-btn:hover{background:var(--canvas);color:var(--ink)}
.topbar-dot{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface-card);animation:blip 2s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:0.3}}
.topbar-avatar{width:28px;height:28px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0}

/* ─── MOBILE ─── */
.mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:40;opacity:0;pointer-events:none;transition:opacity 200ms}
.mobile-overlay.open{opacity:1;pointer-events:auto}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-dark);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:450;z-index:200;box-shadow:var(--shadow-modal);display:flex;align-items:center;gap:8px;animation:toastUp 200ms cubic-bezier(0.16,1,0.3,1)}
@keyframes toastUp{0%{opacity:0;transform:translateX(-50%) translateY(12px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ─── NOTIFICATION DROPDOWN ─── */
.notif-dropdown{position:absolute;top:calc(100% + 4px);right:0;width:320px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-modal);z-index:100;max-height:360px;overflow-y:auto}
.notif-dropdown-h{padding:10px 12px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between}
.notif-dropdown-h h4{font-size:12px;font-weight:600}
.notif-dropdown-h button{font-size:11px;color:var(--primary);font-weight:500}
.notif-dropdown-item{display:flex;gap:8px;padding:10px 12px;cursor:pointer;transition:var(--transition);align-items:flex-start}
.notif-dropdown-item:hover{background:var(--canvas)}
.notif-dropdown-item.unread{background:var(--primary-bg)}
.notif-dropdown-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:4px}
.notif-dropdown-dot.read{background:var(--hairline)}
.notif-dropdown-body{flex:1;min-width:0}
.notif-dropdown-title{font-size:12px;font-weight:500;line-height:1.3}
.notif-dropdown-desc{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px}
.notif-dropdown-time{font-size:10px;color:var(--ash);margin-top:2px}
.notif-dropdown-view{display:block;text-align:center;padding:10px;font-size:12px;font-weight:500;color:var(--primary);border-top:1px solid var(--hairline);cursor:pointer}
.notif-dropdown-view:hover{background:var(--canvas)}
.position-relative{position:relative}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;padding:24px 28px}
.content h1{font-size:20px;font-weight:600;letter-spacing:-0.03em;color:var(--ink);line-height:1.3}
.content .sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:400}
.page-h{margin-bottom:20px}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-0.03em}
.page-h p{font-size:13px;color:var(--muted);margin-top:2px}
.page-h-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ─── STATS ─── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-card);transition:var(--transition)}
.stat:hover{box-shadow:var(--shadow-elevated)}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.stat-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.stat-icon.orange{background:var(--primary-bg);color:var(--primary)}
.stat-icon.green{background:var(--success-bg);color:var(--success)}
.stat-icon.blue{background:var(--info-bg);color:var(--info)}
.stat-icon.amber{background:var(--warning-bg);color:var(--warning)}
.stat-label{font-size:12px;color:var(--muted);font-weight:450}
.stat-value{font-size:22px;font-weight:600;letter-spacing:-0.03em;line-height:1.2;margin-top:2px}
.stat-change{font-size:11px;font-weight:450;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.stat-change.up{color:var(--success)}
.stat-change.down{color:var(--danger)}

/* ─── PANELS / CARDS ─── */
.panel{background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-h h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--body)}
.panel-b{padding:0 16px}
.panel-action{font-size:12px;font-weight:500;color:var(--primary);cursor:pointer;transition:var(--transition);padding:3px 8px;border-radius:var(--radius-sm);background:none;border:none}
.panel-action:hover{background:var(--primary-bg)}

/* ─── GRID UTILS ─── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.gap-top{margin-top:12px}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--radius-full);font-size:10px;font-weight:500;line-height:1.4;text-transform:uppercase;letter-spacing:0.04em}
.badge-conf{background:var(--info-bg);color:var(--info)}
.badge-pack{background:var(--primary-bg);color:var(--primary)}
.badge-ship{background:var(--warning-bg);color:var(--warning-deep,#ab570a)}
.badge-del{background:var(--success-bg);color:var(--success)}
.badge-can{background:var(--danger-bg);color:var(--danger)}

/* ─── ORDER ROWS ─── */
.orow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline);cursor:pointer;transition:var(--transition)}
.orow:last-of-type{border-bottom:none}
.orow:hover{opacity:0.7}
.orow-ico{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.orow-info{flex:1;min-width:0}
.orow-tit{font-size:13px;font-weight:500}
.orow-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow-r{text-align:right;flex-shrink:0}
.orow-amt{font-size:13px;font-weight:600}
.orow-date{font-size:10px;color:var(--ash);margin-top:1px}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;transition:var(--transition);line-height:1.2;white-space:nowrap;border:none}
.btn-p{background:var(--primary);color:var(--on-primary)}
.btn-p:hover{background:var(--primary-deep)}
.btn-p:active{transform:scale(0.98)}
.btn-s{background:var(--surface-card);color:var(--ink);border:1px solid var(--hairline)}
.btn-s:hover{background:var(--canvas)}
.btn-g{background:transparent;color:var(--muted);padding:6px 10px;font-size:11px}
.btn-g:hover{background:var(--canvas);color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-ico{width:30px;height:30px;padding:0;border-radius:var(--radius-sm)}
.btn-d{background:var(--danger-bg);color:var(--danger)}
.btn-d:hover{background:var(--danger);color:#fff}
.btn-dark{background:var(--surface-dark);color:var(--on-primary)}
.btn-dark:hover{opacity:0.9}
.btn-block{width:100%}
.btn-loading{position:relative;pointer-events:none;opacity:0.7}
.btn-loading::after{content:'';width:12px;height:12px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin 500ms linear infinite;display:inline-block;margin-left:4px}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ─── EMPTY STATE ─── */
.empty{padding:48px 20px;text-align:center}
.empty-icon{width:36px;height:36px;margin:0 auto 12px;color:var(--stone);display:block}
.empty h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:2px}
.empty p{font-size:12px;color:var(--ash);max-width:240px;margin:0 auto 12px}

/* ─── DELIVERY STEPS ─── */
.del-steps{display:flex;gap:0;padding:4px 0}
.del-step{flex:1;text-align:center;padding:10px 4px;position:relative;transition:var(--transition)}
.del-step-circle{width:28px;height:28px;border-radius:var(--radius-full);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;z-index:2;transition:var(--transition)}
.del-step.done .del-step-circle{background:var(--primary);color:var(--on-primary)}
.del-step.active .del-step-circle{background:var(--surface-card);border:2px solid var(--primary);color:var(--primary);animation:ringPulse 2s infinite}
.del-step.pending .del-step-circle{background:var(--surface-soft);color:var(--stone)}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(234,40,4,0.3)}70%{box-shadow:0 0 0 6px rgba(234,40,4,0)}100%{box-shadow:0 0 0 0 rgba(234,40,4,0)}}
.del-step-label{font-size:9px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em}
.del-step.done .del-step-label{color:var(--primary)}
.del-step-sub{font-size:9px;color:var(--ash);margin-top:1px}
.del-step:not(:last-child)::after{content:'';position:absolute;top:24px;left:calc(50% + 14px);right:calc(-50% + 14px);height:1.5px;background:var(--hairline);transition:var(--transition)}
.del-step.done:not(:last-child)::after{background:var(--primary)}

/* ─── TIMELINE ─── */
.tl-item{display:flex;gap:12px;padding:12px 0;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:10px;top:30px;bottom:0;width:1px;background:var(--hairline)}
.tl-item.tl-active:not(:last-child)::before{background:var(--primary)}
.tl-dot{width:20px;height:20px;border-radius:var(--radius-full);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:2px;position:relative;z-index:2;transition:var(--transition)}
.tl-dot.done{background:var(--primary);color:var(--on-primary)}
.tl-dot.active{background:var(--surface-card);border:2px solid var(--primary);color:var(--primary);animation:ringPulse 2s infinite}
.tl-dot.pending{background:var(--surface-soft);color:var(--stone)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:500}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px}
.tl-time{font-size:10px;color:var(--ash);margin-top:2px}

/* ─── MAP ─── */
.map-ph{background:var(--surface-soft);border-radius:var(--radius-md);height:180px;display:flex;align-items:center;justify-content:center;color:var(--ash);font-size:12px;flex-direction:column;gap:6px}
.map-ph svg{width:24px;height:24px;opacity:0.4}

/* ─── ADDRESS ─── */
.addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr-card{background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:14px;transition:var(--transition)}
.addr-card:hover{border-color:var(--primary)}
.addr-tag{display:inline-flex;padding:2px 7px;border-radius:var(--radius-full);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;background:var(--primary-bg);color:var(--primary);margin-bottom:6px}
.addr-default{font-size:9px;color:var(--success);font-weight:500;margin-left:6px}
.addr-name{font-size:13px;font-weight:500}
.addr-line{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.addr-acts{display:flex;gap:6px;margin-top:8px}

/* ─── PAYMENT METHODS ─── */
.pm-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--hairline);transition:var(--transition)}
.pm-row:last-child{border-bottom:none}
.pm-row:hover{opacity:0.7}
.pm-icon{width:36px;height:24px;border-radius:var(--radius-xs);background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pm-info{flex:1;min-width:0}
.pm-name{font-size:13px;font-weight:500}
.pm-digits{font-family:var(--font-mono);font-size:11px;color:var(--ash)}
.pm-badge{font-size:9px;color:var(--success);font-weight:500}

/* ─── NOTIFICATIONS ─── */
.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--hairline);cursor:pointer;transition:var(--transition)}
.notif-item:hover{background:var(--canvas);margin:0 -16px;padding:12px 16px;border-radius:var(--radius-sm)}
.notif-item:last-of-type{border-bottom:none}

.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.wish-item{background:var(--surface-card);border:1px solid var(--hairline);border-radius:var(--radius-md);overflow:hidden;transition:var(--transition);cursor:pointer}

.wish-rm{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:var(--radius-full);background:var(--surface-card);display:flex;align-items:center;justify-content:center;color:var(--ash);box-shadow:var(--shadow-card);font-size:12px;transition:var(--transition);cursor:pointer;z-index:2;border:none}

.wish-body{padding:10px 12px}
.wish-name{font-size:12px;font-weight:500;display:block}
.wish-price{font-size:13px;font-weight:600;color:var(--primary);margin-top:2px;display:block}
.wish-acts{display:flex;gap:6px;margin-top:6px}

.offer-title{font-weight:500}

  .notif-dropdown{width:280px;right:-40px}
  .prod-grid{grid-template-columns:1fr 1fr}

@media(max-width:480px){

  .topbar-search{max-width:140px}
  .content{padding:12px}
  .wish-grid,.prod-grid{grid-template-columns:1fr}
}

/* ─── SHARED COMPONENTS ─── */
function Badge({ status }) {
  const cls = status==='delivered'?'badge del':status==='shipped'?'badge ship':status==='packed'?'badge pack':status==='confirmed'?'badge conf':'badge conf';
  return D('span', { className:cls }, status.charAt(0).toUpperCase()+status.slice(1));
}

function StatCard({ icon, label, value, change, up, iconCls }) {
  return D('div', { className:'stat' },
    D('div', { className:'stat-top' },
      D('span', { className:'stat-label' }, label),
      D('div', { className:`stat-icon ${iconCls}` }, icon),
    ),
    D('div', { className:'stat-value' }, value),
    change && D('div', { className:`stat-change ${up?'up':'down'}` }, up?'↑ ':'↓ ', change),
  );
}

function DeliveryStatus({ status }) {
  const steps = [{ key:'confirmed', label:'Confirmed' }, { key:'packed', label:'Packed' }, { key:'shipped', label:'Shipped' }, { key:'delivered', label:'Delivered' }];
  const idx = steps.findIndex(s=>s.key===status);
  return D('div', { className:'del-steps' }, steps.map((s,i)=>D('div', { key:s.key, className:`del-step ${i<idx?'done':i===idx?'active':'pending'}` },
    D('div', { className:'del-step-circle' }, i<idx?'✓':i+1),
    D('div', { className:'del-step-label' }, s.label),
    D('div', { className:'del-step-sub' }, i===0?'May 23':i===1?'May 24':i===2?'May 25':'Today'),
  )));
}

function Timeline({ events }) {
  return D('div', null, events.map((e,i)=>D('div', { key:i, className:'tl-item' },
    D('div', { className:`tl-dot ${e.status}` }, e.status==='done'?'✓':e.status==='active'?'●':'○'),
    D('div', { className:'tl-body' },
      D('div', { className:'tl-title' }, e.label),
      D('div', { className:'tl-sub' }, e.desc),
      D('div', { className:'tl-time' }, e.time),
    ),
  )));
}

function OrderRow({ o, onClick }) {
  return D('div', { className:'orow', onClick },

function ShopPage({ cartItems, setCartItems, toast }) {
  const [cat, setCat] = useState('All');
  const [q, setQ] = useState('');
  const [loadingId, setLoadingId] = useState(null);
  const filtered = PRODUCTS.filter(p=>(cat==='All'||p.cat===cat) && (!q||p.name.toLowerCase().includes(q.toLowerCase())));
  const addToCart = (prod) => {
    setLoadingId(prod.id);
    setTimeout(() => {
      setCartItems(prev => {
        const ex = prev.find(i => i.id === prod.id);
        return ex ? prev.map(i=>i.id===prod.id?{...i,qty:i.qty+1}:i) : [...prev, { id:prod.id, name:prod.name, desc:prod.desc, qty:1, price:prod.price, emoji:prod.emoji }];
      });
      setLoadingId(null);
      toast?.('Added to cart');
    }, 500);
  };
  return D('div', null,
    D('div', { className:'page-h' },
      D('h1', null, 'Shop'),
      D('p', { className:'sub' }, 'Browse authentic African food products.'),
    ),
    D('div', { className:'shop-search' },
      D(Svg, { name:'search', size:14 }),
      D('input', { placeholder:'Search products...', value:q, onChange:e=>setQ(e.target.value) }),

    D('div', { className:'prod-grid' }, filtered.map(p=>D('div', { key:p.id, className:'prod-card' },
      D('div', { className:'prod-img' },
        p.emoji,
        p.tag && D('span', { className:`prod-tag ${p.tag}` }, p.tag==='popular'?'Popular':p.tag==='new'?'New':'Sale'),
      ),
      D('div', { className:'prod-body' },
        D('span', { className:'prod-name' }, p.name),
        D('span', { className:'prod-desc' }, p.desc),
        D('span', { className:'prod-rating' }, D('span', { className:'prod-stars' }, '★'), ` ${p.rating.toFixed(1)}`),
        D('span', { className:'prod-price' },
          `₦${p.price.toFixed(2)}`,
          p.origPrice && D('s', null, `₦${p.origPrice.toFixed(2)}`),
        ),
        D('div', { className:'prod-acts' },
          D('button', {
            className:`btn ${cartItems.some(i=>i.id===p.id)?'btn-s':'btn-p'} btn-sm${loadingId===p.id?' btn-loading':''}`,
            style:{ flex:1 },

    filtered.length===0 && D('div', { className:'empty' },

/* ─── TRACKING ─── */
function TrackingPage({ toast }) {
  const [events, setEvents] = useState(TRACKING_EVENTS);
  const [trackingStatus, setTrackingStatus] = useState('shipped');
  const advanceStatus = () => {
    const order = ['confirmed','packed','shipped','delivered'];
    const idx = order.indexOf(trackingStatus);
    if (idx < order.length - 1) {
      const next = order[idx + 1];
      setTrackingStatus(next);
      setEvents(prev => prev.map((e,i) => {
        const labels = ['Order Confirmed','Preparing at Warehouse','Packed & Labelled','Out for Delivery','Delivered'];
        const li = labels.indexOf(e.label);
        const ni = order.indexOf(next);
        if (li <= ni && e.status==='pending') return {...e, status: li===ni ? 'active' : 'done', time: li===ni ? 'Just now' : e.time};
        return e;
      }));
      toast?.(`Order status: ${next.charAt(0).toUpperCase()+next.slice(1)}`);
    } else toast?.('Already delivered! 🎉');
  };
  return D('div', null,
    D('div', { className:'page-h page-h-row' },
      D('div', null,
        D('h1', null, 'Tracking'),
        D('p', { className:'sub' }, 'Order NP-3841 · Suya Spice Set + Plantain Chips'),
      ),
      D('div', { className:'track-pulse' }, 'Live'),
    ),
    D('div', { className:'panel' },
      D('div', { className:'panel-h' }, D('h3', null, '📍 Delivery Map'), D('span', { className:'badge ship' }, 'Live')),
      D('div', { className:'panel-b', style:{ padding:0 } },
        D('div', { className:'map-ph' },
          D(Svg, { name:'map', size:24 }),
          D('span', null, 'Map view — OpenStreetMap integration'),
          D('div', { className:'live-controls' },
            D('button', { className:'btn btn-p btn-sm', onClick:advanceStatus }, '▶ Simulate Next Status'),
            trackingStatus==='delivered' && D('span', { style:{ fontSize:10, color:'var(--success)', fontWeight:500, fontFamily:'var(--font-mono)' } }, '✓ Delivered'),
          ),
        ),
      ),
    ),
    D('div', { className:'g2 gap-top' },
      D('div', { className:'panel' },
        D('div', { className:'panel-h' }, D('h3', null, 'Timeline'), D('span', { style:{ fontSize:10, color:'var(--ash)', fontFamily:'var(--font-mono)' } }, 'Auto-updates')),
        D('div', { className:'panel-b' }, D(Timeline, { events })),

/* ─── ADDRESSES ─── */
function AddressesPage({ toast }) {
  const [view, setView] = useState(null);
  const [addresses, setAddresses] = useState(ADDRESSES);
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);

  const back = cb => () => { setView(null); setForm(null); if(cb)cb(); };
  const update = k => e => setForm(p => ({ ...(p||{}), [k]: e?.target != null ? e.target.value : e }));
  const setTag = t => setForm(p => ({ ...(p||{}), tag:t }));

  const isAdd = view === 'add';
  const isEdit = view && typeof view === 'number';
  if (!isAdd && !isEdit) {
    return D('div', null,
      D('div', { className:'page-h page-h-row' },
        D('div', null, D('h1', null, 'Addresses'), D('p', { className:'sub' }, 'Manage your delivery addresses.')),

      D('div', { className:'addr-grid' }, addresses.map(a=>D('div', { key:a.id, className:'addr-card', onClick:()=>setView(a.id), style:{ cursor:'pointer' } },
        D('div', { style:{ display:'flex', alignItems:'center' } },
          D('span', { className:'addr-tag' }, a.tag),
          a.default && D('span', { className:'addr-default' }, 'Default'),
        ),
        D('div', { className:'addr-name' }, a.name),
        D('div', { className:'addr-line' }, a.line),
      ))),
      addresses.length===0 && D('div', { className:'empty' }, D('h3', null, 'No saved addresses'), D('p', null, 'Add a delivery address to get started.')),
    );
  }

  if (isAdd || isEdit) {
    const address = isEdit ? addresses.find(a => a.id === view) : null;
    const f = form || address || { tag:'', name:'', line:'', phone:'', default:false };
    const handleSave = () => {
      if (!f.tag || !f.line) return toast?.('Please fill in required fields');
      setSaving(true);
      setTimeout(() => {
        if (isAdd) {
          const newId = Math.max(0, ...addresses.map(a => a.id)) + 1;
          setAddresses(p => [...p, { id:newId, ...f, default: f.default || p.length===0 }]);
        } else {
          setAddresses(p => p.map(x => x.id === view ? { ...f, id:view } : x));
        }
        setSaving(false); setForm(null); setView(null);
        toast?.(isAdd ? 'Address added' : 'Address updated');
      }, 800);
    };
    const handleDelete = () => {
      if (address?.default) return toast?.('Cannot delete default address');
      setAddresses(p => p.filter(x => x.id !== view));
      setView(null);
      toast?.('Address deleted');
    };
    const tagBtns = ['Home','Office','Parents'];

    if (isEdit && !form && address) {
      return D('div', null,
        D('div', { className:'page-h' },
          D('button', { style:{ fontSize:12, color:'var(--primary)', fontWeight:500, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:4, marginBottom:4 }, onClick:back() },
            D('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 }, D('polyline', { points:'15 18 9 12 15 6' })), 'Back',
          ),
          D('h1', null, address.tag),
        ),
        D('div', { className:'panel', style:{ maxWidth:560 } },
          D('div', { className:'panel-b', style:{ padding:20 } },
            D('div', { className:'di-grid', style:{ gridTemplateColumns:'1fr' } },
              D('div', null,
                D('div', { className:'di-label' }, 'Recipient'),
                D('div', { className:'di-value', style:{ fontSize:15, fontWeight:600, marginTop:2 } }, address.name),
              ),
              D('div', null,
                D('div', { className:'di-label' }, 'Address'),
                D('div', { className:'di-value', style:{ marginTop:2 } }, address.line),
              ),
              D('div', null,
                D('div', { className:'di-label' }, 'Phone'),
                D('div', { className:'di-value', style:{ marginTop:2 } }, address.phone || '—'),
              ),
              address.default && D('div', { style:{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--success-bg)', color:'var(--success)', padding:'4px 12px', borderRadius:'var(--radius-full)', fontSize:12, fontWeight:600, width:'fit-content' } },
                D('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 }, D('polyline', { points:'20 6 9 17 4 12' })), 'Default Address',
              ),
            ),
            D('div', { style:{ marginTop:20, display:'flex', gap:8 } },
              D('button', { className:'btn btn-p', onClick:()=>setForm({...address}) }, 'Edit Address'),
              !address.default && D('button', { className:'btn btn-d', onClick:handleDelete }, 'Delete'),
            ),
          ),
        ),
      );
    }

    return D('div', null,
      D('div', { className:'page-h' },
        D('button', { style:{ fontSize:12, color:'var(--primary)', fontWeight:500, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:4, marginBottom:4 }, onClick:back(), disabled:saving },
          D('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 }, D('polyline', { points:'15 18 9 12 15 6' })), 'Back',
        ),
        D('h1', null, isAdd ? 'Add Address' : 'Edit Address'),
      ),
      D('div', { className:'panel', style:{ maxWidth:560 } },
        D('div', { className:'panel-b', style:{ padding:20 } },
          D('label', { className:'di-label', style:{ marginTop:0 } }, 'Tag'),
          D('div', { style:{ display:'flex', gap:8, marginBottom:16 } },
            tagBtns.map(t => D('button', {
              key:t, className:`btn btn-sm ${f.tag===t ? 'btn-p' : 'btn-s'}`,
              onClick:()=>setTag(t)
            }, t)),
          ),
          D('label', { className:'di-label' }, 'Full Name'),
          D('input', { className:'di-input', value:f.name, onChange:update('name'), placeholder:'Full name' }),
          D('label', { className:'di-label' }, 'Phone Number'),
          D('input', { className:'di-input', value:f.phone||'', onChange:update('phone'), placeholder:'Phone number' }),
          D('label', { className:'di-label' }, 'Delivery Address'),
          D('textarea', { className:'di-input', rows:3, value:f.line, onChange:update('line'), placeholder:'Street, city, state, postal code' }),
          D('div', { style:{ display:'flex', alignItems:'center', gap:8, marginTop:12 } },
            D('input', { type:'checkbox', id:'addr-def', checked:!!f.default, onChange:e=>setForm(p=>({...p, default:e.target.checked})) }),
            D('label', { htmlFor:'addr-def', style:{ fontSize:13, color:'var(--muted)' } }, 'Set as default address'),
          ),
          D('div', { style:{ marginTop:20, display:'flex', gap:8 } },
            D('button', { className:'btn btn-p', onClick:handleSave, disabled:saving }, saving ? 'Saving…' : (isAdd ? 'Save Address' : 'Save Changes')),
            D('button', { className:'btn btn-s', onClick:back(), disabled:saving }, 'Cancel'),

                D('div', null, D('div', { className:'di-label' }, 'Account Name'), D('div', { className:'di-value' }, 'NaijaPlate Payments Ltd')),
                D('div', null, D('div', { className:'di-label' }, 'Account Number'), D('div', { className:'di-value', style:{ fontFamily:'var(--font-mono)' } }, '012 345 6789')),
              ),
            ),
          ),
          payStep===2 && D('div', null,
            [{ id:'opay', name:'OPay', desc:'Quick & secure' },{ id:'paga', name:'Paga', desc:'Available nationwide' }].map(p=>D('div', { key:p.id, className:'pay-opt' },
              D('div', { className:'pay-opt-radio' }), D('span', { className:'pay-opt-icon' }, '📱'),
              D('div', null, D('div', { className:'pay-opt-name' }, p.name), D('div', { className:'pay-opt-desc' }, p.desc)),
            )),
          ),
          D('div', { style:{ marginTop:12 } }, D('button', { className:'btn btn-p btn-block', onClick:handleSave, disabled:savePay }, savePay?'Saving...':'Save Payment Method')),
        ),
      ),
    );
  }

  return D('div', null,
    D('div', { className:'page-h page-h-row' },
      D('div', null, D('h1', null, 'Payments'), D('p', { className:'sub' }, 'Manage payment methods and view transactions.')),
      D('button', { className:'btn btn-p btn-sm', onClick:()=>setAddPay(true) }, '+ Add Method'),
    ),
    D('div', { className:'g2' },
      D('div', null,
        D('div', { className:'panel mb-16' },
          D('div', { className:'panel-h' }, D('h3', null, 'Saved Methods')),
          D('div', { className:'panel-b' }, methods.map(m=>D('div', { key:m.id, className:'pm-row' },
            D('div', { className:'pm-icon' }, m.icon),
            D('div', { className:'pm-info' },
              D('div', null, D('span', { className:'pm-name' }, m.name), m.default && D('span', { className:'pm-badge', style:{ marginLeft:6 } }, 'Default')),
              D('span', { className:'pm-digits' }, m.digits),
            ),
            m.exp && D('span', { style:{ fontSize:10, color:'var(--ash)', fontFamily:'var(--font-mono)' } }, m.exp),
          ))),
        ),
      ),
      D('div', null,
        D('div', { className:'panel' },
          D('div', { className:'panel-h' }, D('h3', null, 'Recent Transactions')),
          D('div', { className:'panel-b' }, TRANSACTIONS.map(t=>D('div', { key:t.id, className:'txn-row', onClick:()=>setTxnView(t.id) },
            D('div', { className:'txn-l' },
              D('div', { className:`txn-icon ${t.type}` }, t.type==='in'?'↓':'↑'),
              D('div', null,
                D('div', { className:'txn-name' }, t.name),
                D('div', { className:'txn-ref' }, t.ref),
              ),
            ),
            D('div', { className:'txn-r' },
              D('span', { className:`txn-amt ${t.type}` }, t.type==='in'?'+':'-', `₦${t.amount.toFixed(2)}`),
              D('span', { className:'txn-date' }, t.date),
            ),
          ))),
        ),
      ),
    ),
  );
}

/* ─── NOTIFICATIONS ─── */
function NotificationsPage({ notifs, setNotifs, setPage }) {
  const [detail, setDetail] = useState(null);
  if (detail) {
    const n = notifs.find(x=>x.id===detail);
    if (!n) return null;
    const isOrder = n.id<=2||n.id===4;
    const isPromo = n.id===3||n.id===5;
    return D('div', null,
      D('div', { className:'page-h' },
        D('button', { style:{ fontSize:12, color:'var(--primary)', fontWeight:500, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:4, marginBottom:4 }, onClick:()=>setDetail(null) },
          D('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 }, D('polyline', { points:'15 18 9 12 15 6' })), 'Back',
        ),
        D('h1', null, 'Notification'),
      ),
      D('div', { className:'panel' },
        D('div', { className:'panel-b', style:{ padding:'20px' } },
          D('div', { style:{ fontSize:24, marginBottom:8 } }, isOrder?'📦':isPromo?'🏷️':'🎉'),
          D('h2', { style:{ fontSize:16, fontWeight:600, letterSpacing:'-0.02em', marginBottom:4 } }, n.title),
          D('div', { style:{ fontSize:11, color:'var(--ash)', marginBottom:10 } }, n.time),
          D('div', { style:{ fontSize:13, color:'var(--body)', lineHeight:1.5, marginBottom:14 } }, n.desc),
          isOrder && D('div', null,
            D('button', { className:'btn btn-p btn-sm', onClick:()=>setPage('orders') }, 'View Order →'),
          ),
          isPromo && D('div', { className:'di-grid', style:{ marginTop:8 } },
            D('div', null, D('div', { className:'di-label' }, 'Promo Code'), D('div', { className:'di-value', style:{ fontFamily:'var(--font-mono)' } }, 'GRAIN20')),
            D('div', null, D('div', { className:'di-label' }, 'Valid Until'), D('div', { className:'di-value' }, 'June 7, 2026')),
          ),
        ),
      ),
    );
  }
  return D('div', null,
    D('div', { className:'page-h' },
      D('h1', null, 'Notifications'),
      D('p', { className:'sub' }, `${notifs.filter(n=>!n.read).length} unread`),
    ),
    D('div', { className:'panel' },
      D('div', { className:'panel-b' },
        notifs.length===0
          ? D('div', { className:'empty' }, D('h3', null, 'No notifications yet'))
          : notifs.map(n=>D('div', { key:n.id, className:'notif-item', onClick:()=>{
              setNotifs(prev=>prev.map(x=>x.id===n.id?{...x,read:true}:x));
              setDetail(n.id);
            }},
            D('div', { className:`notif-dot${n.read?' read':''}` }),
            D('div', { className:'notif-body' },
              D('div', { className:'notif-title' }, n.title),
              D('div', { className:'notif-desc' }, n.desc),
              D('div', { className:'notif-time' }, n.time),
            ),
          )),
      ),
    ),
  );
}

/* ─── SETTINGS ─── */
function SettingsPage({ toast }) {
  const [pwErr, setPwErr] = useState('');
  const [pwOk, setPwOk] = useState(false);
  const [profileSaving, setProfileSaving] = useState(false);
  const [pwSaving, setPwSaving] = useState(false);
  const saveProfile = () => {
    setProfileSaving(true);
    setTimeout(()=>{setProfileSaving(false);toast?.('Profile updated');},800);
  };
  const savePassword = () => {
    const old = document.getElementById('old-pw')?.value;
    const pw1 = document.getElementById('new-pw')?.value;
    const pw2 = document.getElementById('conf-pw')?.value;
    if (!old||!pw1||!pw2) return setPwErr('Fill all fields');;
    if (pw1.length<6) return setPwErr('Password must be 6+ characters');;
    if (pw1!==pw2) return setPwErr('Passwords do not match');;
    setPwErr('');setPwSaving(true);
    setTimeout(()=>{setPwSaving(false);setPwOk(true);toast?.('Password updated');setTimeout(()=>setPwOk(false),2000);document.getElementById('old-pw').value='';document.getElementById('new-pw').value='';document.getElementById('conf-pw').value='';},800);
  };
  return D('div', null,
    D('div', { className:'page-h' },
      D('h1', null, 'Settings'),
      D('p', { className:'sub' }, 'Manage your account preferences.'),
    ),
    D('div', { className:'g2' },
      D('div', { className:'panel' },
        D('div', { className:'panel-h' }, D('h3', null, 'Profile')),
        D('div', { className:'panel-b', style:{ padding:'16px' } },
          D('div', { className:'fg' }, D('label', null, 'Full Name'), D('input', { className:'fi', defaultValue:'Amara Okafor' })),
          D('div', { className:'fg' }, D('label', null, 'Email'), D('input', { className:'fi', defaultValue:'amara.o@naijaplate.com', type:'email' })),
          D('div', { className:'fg' }, D('label', null, 'Phone'), D('input', { className:'fi', defaultValue:'+234 803 456 7890' })),
          D('button', { className:'btn btn-p', onClick:saveProfile, disabled:profileSaving }, profileSaving?'Saving...':'Save Changes'),
        ),
      ),
      D('div', { className:'panel' },
        D('div', { className:'panel-h' }, D('h3', null, 'Password')),
        D('div', { className:'panel-b', style:{ padding:'16px' } },
          D('div', { className:'fg' }, D('label', null, 'Current Password'), D('input', { id:'old-pw', className:'fi', type:'password', placeholder:'••••••••' })),
          D('div', { className:'fg' }, D('label', null, 'New Password'), D('input', { id:'new-pw', className:'fi', type:'password', placeholder:'••••••••' })),
          D('div', { className:'fg' }, D('label', null, 'Confirm New'), D('input', { id:'conf-pw', className:'fi', type:'password', placeholder:'••••••••' })),
          pwErr && D('div', { className:'fe', style:{ marginBottom:6 } }, pwErr),
          pwOk && D('div', { style:{ fontSize:11, color:'var(--success)', marginBottom:6 } }, '✓ Password updated'),
          D('button', { className:'btn btn-p', onClick:savePassword, disabled:pwSaving }, pwSaving?'Updating...':'Update Password'),
        ),
      ),
    ),
    D('div', { className:'panel gap-top' },
      D('div', { className:'panel-h' }, D('h3', null, 'Preferences')),
      D('div', { className:'panel-b', style:{ padding:'16px' } },
        D('div', { className:'fg' },
          D('label', null, 'Notification preferences'),
          D('div', { style:{ display:'flex', flexDirection:'column', gap:8 } },
            ['Order updates via email','SMS for delivery alerts','Promotional offers'].map(p=>D('label', { key:p, style:{ display:'flex', alignItems:'center', gap:8, fontSize:12, cursor:'pointer', color:'var(--body)' } },
              D('input', { type:'checkbox', defaultChecked:true, style:{ accentColor:'var(--primary)' } }),
              p,
            )),
          ),
        ),
      ),
    ),
  );
}

/* ─── APP ─── */
function App() {
  const [page, setPage] = useState('overview');
  const [sidebar, setSidebar] = useState(false);
  const [cartItems, setCartItems] = useState(INITIAL_CART);
  const [notifs, setNotifs] = useState(INITIAL_NOTIFS);
  const [notifOpen, setNotifOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const notifRef = useRef(null);
  const toastTimer = useRef(null);
  const toast = useCallback((msg) => {
    setToastMsg(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToastMsg(null), 2600);
  }, []);
  useEffect(() => {
    const f = (e) => { if (notifRef.current && !notifRef.current.contains(e.target)) setNotifOpen(false); };
    document.addEventListener('mousedown', f);
    return () => document.removeEventListener('mousedown', f);
  }, []);
  const cartCount = cartItems.reduce((s,i)=>s+i.qty, 0);
  const navItems = NAV;
  const PAGES = {
    shop: D(ShopPage, { cartItems, setCartItems, toast, setPage }),
    overview: D(Overview, { setPage, toast, cartItems, setCartItems }),
    orders: D(OrdersPage, { setCartItems, toast }),
    tracking: D(TrackingPage, { toast }),
    cart: D(CartPage, { cartItems, setCartItems, setPage, toast }),
    wishlist: D(WishlistPage, { setCartItems, toast, setPage }),
    addresses: D(AddressesPage, { toast }),
    payments: D(PaymentsPage, { toast }),
    notifications: D(NotificationsPage, { notifs, setNotifs, setPage }),
    settings: D(SettingsPage, { toast }),
  };
  return D('div', { className:'app' },
    D('div', { className:`mobile-overlay${sidebar?' open':''}`, onClick:()=>setSidebar(false) }),
    D('div', { className:`sidebar${sidebar?' open':''}` },
      D('div', { className:'sidebar-brand' },
        D('div', { className:'sidebar-mark' }, 'NP'),
        D('div', null, D('div', { className:'sidebar-name' }, 'NaijaPlate'), D('div', { style:{ fontSize:10, color:'var(--muted)', fontWeight:450 } }, 'Dashboard')),
      ),
      D('div', { className:'sidebar-nav' },
        D('div', { className:'sidebar-group' }, 'Menu'),
        navItems.map(item=>D('div', { key:item.id, className:`sidebar-link${page===item.id?' active':''}`, onClick:()=>{setPage(item.id);setSidebar(false)} },
          D(Svg, { name:item.icon }),
          D('span', null, item.label),
          item.label==='Cart' && cartCount>0 && D('span', { className:'sidebar-link-badge' }, cartCount),
        )),
      ),
      D('div', { className:'sidebar-foot' },
        D('div', { className:'sidebar-user', onClick:()=>setPage('settings') },
          D('div', { className:'sidebar-user-av' }, 'AO'),
          D('div', null,
            D('div', { className:'sidebar-user-name' }, 'Amara Okafor'),
            D('div', { className:'sidebar-user-role' }, 'amara.o@naijaplate.com'),
          ),
        ),
      ),
    ),
    D('div', { className:'main' },
      D('div', { className:'topbar' },
        D('button', { className:'topbar-mobile', onClick:()=>setSidebar(true) },
          D('svg', { width:18, height:18, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 },
            D('line', { x1:'3', y1:'6', x2:'21', y2:'6' }),
            D('line', { x1:'3', y1:'12', x2:'21', y2:'12' }),
            D('line', { x1:'3', y1:'18', x2:'21', y2:'18' }),
          ),
        ),
        D('div', { className:'topbar-search' },
          D(Svg, { name:'search', size:14 }),
          D('input', { placeholder:'Search...' }),
        ),
        D('div', { className:'topbar-actions' },
          D('div', { className:'position-relative', ref:notifRef },
            D('button', { className:'topbar-btn', onClick:()=>setNotifOpen(!notifOpen) },
              D(Svg, { name:'bell' }),
              notifs.some(n=>!n.read) && D('span', { className:'topbar-dot' }),
            ),
            notifOpen && D(NotifDropdown, { notifs, setNotifs, setPage, toast }),
          ),
          D('div', { className:'topbar-avatar', onClick:()=>setPage('settings') }, 'AO'),
        ),
      ),
      D('div', { className:'content' }, PAGES[page] || PAGES.overview),
    ),
    toastMsg && D('div', { className:'toast' }, toastMsg),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(D(App));
</script>
</body>
</html>
